<!-- Collective Edge header band — drop-in markup.
     Drop this into the top of any one-pager / report / deck header.
     Edit the .h1 text. Logo loads from the CDN.
     Make sure brand-base.css (or equivalent @font-face) is loaded for Montserrat.
     CE runs dark-first: black band, white logo. -->
<header style="background:#000000; color:#FFFFFF; padding:0.32in 0.5in; display:flex; align-items:center; justify-content:space-between; font-family:'Montserrat',sans-serif;">
  <div class="h1" style="font-weight:800; font-size:18pt; letter-spacing:0.04em; text-transform:uppercase; line-height:1.05;">
    YOUR TITLE HERE
  </div>
  <img
    src="https://cdn.jsdelivr.net/gh/collective-edge/collective-edge-brand-kit@main/assets/logos/horizontal-white.svg"
    alt="Collective Edge"
    style="width:1.7in; height:auto; display:block;"
  />
</header>
